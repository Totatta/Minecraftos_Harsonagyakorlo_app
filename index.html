<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hangépítő – harsonagyakorló</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --ink:#1B2340; --muted:#5B6585; --line:#D5DAE6;
  --brass:#B9861F; --ok:#24804F; --ok-soft:#D7F0E2; --bad:#B8402B; --bad-soft:#F7DDD6; --staff:#1B2340;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10162A; --surface:#1A2240; --ink:#EDF0F7; --muted:#9AA3C0; --line:#2C365C;
    --brass:#E3B451; --ok:#4CC383; --ok-soft:#173A2A; --bad:#EF7A63; --bad-soft:#40211C; --staff:#EDF0F7;
  }
}
:root[data-theme="dark"]{
  --bg:#10162A; --surface:#1A2240; --ink:#EDF0F7; --muted:#9AA3C0; --line:#2C365C;
  --brass:#E3B451; --ok:#4CC383; --ok-soft:#173A2A; --bad:#EF7A63; --bad-soft:#40211C; --staff:#EDF0F7;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
main{max-width:520px;margin:0 auto;padding:12px 14px 32px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:1.4rem;margin:0;letter-spacing:-.01em}
.score{font-size:.92rem;color:var(--muted);white-space:nowrap}
.score b{color:var(--ink);font-size:1.1rem}

.scene{position:relative;border-radius:18px;overflow:hidden;border:3px solid var(--ink);background:#8ecae6}
.scene canvas{display:block;width:100%;image-rendering:pixelated}
.buildbar{display:flex;align-items:center;gap:10px;margin:8px 2px 0;font-size:.95rem}
.buildbar .nm{font-weight:700}
.buildbar .bar{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.buildbar .fill{height:100%;width:0;background:var(--brass);transition:width .25s}
.buildbar .cnt{color:var(--muted);font-variant-numeric:tabular-nums}
.gallery{color:var(--muted);font-size:.85rem;margin:2px 2px 0;min-height:1.2em}

.overlay{padding:10px!important;position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow-y:auto;background:rgba(16,22,42,.55);color:#fff;text-align:center;padding:16px}
.overlay.show{display:flex}
.overlay .t{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:1.35rem;line-height:1.1;text-shadow:0 2px 0 #000}
.overlay button{background:var(--brass);border-color:var(--brass);color:#1B2340}

.stage{margin-top:12px;background:var(--surface);border-radius:18px;padding:8px 12px 12px;border:1px solid var(--line);transition:background .25s,border-color .25s}
.stage.ok{background:var(--ok-soft);border-color:var(--ok)}
.stage.bad{background:var(--bad-soft);border-color:var(--bad)}
.notearea{display:grid;grid-template-columns:1.35fr 1fr;align-items:center;gap:6px}
.notearea.only-staff{grid-template-columns:1fr}
.notearea.only-name{grid-template-columns:1fr;text-align:center}
svg.staff{display:block;width:100%;height:auto}
.nameblk{text-align:center}
.nameblk .big{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:2.5rem;line-height:1}
.nameblk .oct{color:var(--muted);font-size:.85rem}
.nameblk .pos{color:var(--muted);font-size:.9rem;margin-top:4px}
.pos{margin-top:6px;text-align:center}
.cover{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 14px;border-radius:12px;border:2px dashed var(--muted);background:repeating-linear-gradient(45deg,var(--line) 0 6px,transparent 6px 12px);color:var(--ink);font-weight:700;font-size:.95rem}
.cover.open{border-style:solid;border-color:var(--brass);background:transparent}
.cover b{color:var(--brass);font-size:1.25rem}
.cover small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;width:100%;max-width:420px}
.picks button{padding:5px 3px;min-height:36px;font-size:.8rem;line-height:1.15;border-radius:10px;background:rgba(255,255,255,.92);color:#1B2340;border-color:#fff}
.picks button.done{background:#d7f0e2;border-color:#24804F}
.overlay .sub{font-size:.85rem}

.meter{position:relative;height:44px;margin:8px 4px 2px}
.meter .track{position:absolute;left:0;right:0;top:18px;height:6px;border-radius:3px;background:var(--line)}
.meter .zone{position:absolute;top:12px;height:18px;border-radius:9px;background:var(--ok);opacity:.3;left:40%;width:20%}
.meter .center{position:absolute;left:50%;top:8px;width:2px;height:26px;background:var(--ink);transform:translateX(-1px)}
.meter .needle{position:absolute;top:6px;width:30px;height:30px;border-radius:6px;background:var(--brass);border:3px solid var(--surface);left:50%;transform:translateX(-50%);transition:left .08s linear,opacity .2s;opacity:0}
.meter .lbl{position:absolute;top:36px;font-size:.75rem;color:var(--muted)}
.meter .lbl.l{left:0}.meter .lbl.r{right:0}
.status{text-align:center;font-weight:700;font-size:1.1rem;min-height:1.5em;margin-top:6px}
.status.ok{color:var(--ok)}.status.bad{color:var(--bad)}
.heard{text-align:center;color:var(--muted);font-size:.88rem;min-height:1.3em}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
button{font:inherit;font-weight:700;border-radius:14px;padding:13px 12px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;min-height:50px}
button.primary{grid-column:1/-1;background:var(--brass);border-color:var(--brass);color:#1B2340;font-size:1.1rem}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
details{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 16px}
summary{cursor:pointer;font-weight:700;padding:12px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row label{flex:1}
.row small{display:block;color:var(--muted);font-size:.85rem}
select{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);max-width:55%}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--brass)}
input[type=range]{accent-color:var(--brass);width:45%}
.reset{border-color:var(--bad);color:var(--bad);padding:8px 12px;min-height:0;font-size:.9rem}
.modechip{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:0;margin:0 0 10px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:400;font-size:.92rem;text-align:left}
.modechip b{font-weight:700}
.modechip .chg{color:var(--brass);font-weight:700;white-space:nowrap}
.setup{position:fixed;inset:0;z-index:20;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;background:rgba(16,22,42,.6);padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px))}
.setup.show{display:flex}
.setup .box{width:100%;max-width:480px;background:var(--surface);color:var(--ink);border-radius:20px;border:3px solid var(--ink);padding:16px}
.setup h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:1.35rem;margin:0 0 4px}
.setup h3{font-size:1rem;margin:16px 0 8px}
.opts{display:grid;gap:8px}
.opt{display:block;width:100%;text-align:left;min-height:0;padding:11px 14px;border-radius:14px;border:2px solid var(--line);font-weight:700}
.opt small{display:block;font-weight:400;color:var(--muted);font-size:.85rem;margin-top:2px}
.opt[aria-pressed="true"]{border-color:var(--brass);background:color-mix(in srgb,var(--brass) 16%,transparent)}
.opt[disabled]{opacity:.4;cursor:default}
.go{display:grid;gap:8px;margin-top:18px}
.go button{width:100%}
.rctl{display:flex;align-items:center;gap:8px;margin-top:4px}
.tbtn{min-height:44px;width:44px;padding:0;border-radius:12px;font-size:1.3rem;line-height:1}
.tval{min-width:56px;text-align:center;font-size:.8rem;line-height:1.1;color:var(--muted)}
.tval b{color:var(--ink);font-size:1.1rem}
.rgo{flex:1;background:var(--brass);border-color:var(--brass);color:#1B2340}
.rinfo{text-align:center;color:var(--muted);font-size:.85rem;margin-top:6px;min-height:1.2em}
.cal[hidden]{display:none}
.cal{display:block;margin:6px auto 0;min-height:0;padding:7px 12px;font-size:.88rem;border-color:var(--brass)}
.err{color:var(--bad);text-align:center;margin-top:10px;font-size:.95rem}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Hangépítő</h1>
    <div class="score">Talált <b id="hits">0</b> · sorozat <b id="streak">0</b></div>
  </header>
  <button class="modechip" id="modechip"><span id="modeText"></span><span class="chg">Váltás</span></button>

  <div class="scene" id="scene">
    <canvas id="world" aria-label="Építési terület"></canvas>
    <div class="overlay" id="overlay">
      <div class="t" id="ovText">Kész!</div>
      <div class="sub">Mit építesz következőnek?</div>
      <div class="picks" id="picks"></div>
    </div>
  </div>
  <div class="buildbar"><span class="nm" id="bpName"></span><div class="bar"><div class="fill" id="bpFill"></div></div><span class="cnt" id="bpCnt"></span></div>
  <div class="gallery" id="gallery"></div>

  <section class="stage" id="stage" aria-live="polite">
    <div class="notearea" id="notearea">
      <svg class="staff" id="staff" viewBox="0 0 270 172" role="img" aria-label="Kotta"></svg>
      <div class="nameblk" id="nameblk">
        <div class="big" id="nameBig"></div>
        <div class="oct" id="nameOct"></div>
      </div>
    </div>
    <div id="rwrap" hidden>
      <svg class="staff" id="rstaff" viewBox="0 0 360 158" role="img" aria-label="Az ütem kottája"></svg>
      <div class="rctl">
        <button class="tbtn" id="tDn" aria-label="Lassabb">−</button>
        <span class="tval">tempó<br><b id="tShow">60</b></span>
        <button class="tbtn" id="tUp" aria-label="Gyorsabb">+</button>
        <button class="rgo" id="rGo">Ütem indítása</button>
      </div>
      <div class="rinfo" id="rInfo"></div>
      <button class="cal" id="rCal" hidden></button>
    </div>
    <div class="pos" id="posRow"><button class="cover" id="cover" aria-live="polite"></button></div>
    <div class="meter" aria-hidden="true">
      <div class="track"></div><div class="zone" id="zone"></div><div class="center"></div>
      <div class="needle" id="needle"></div>
      <span class="lbl l">mélyebb</span><span class="lbl r">magasabb</span>
    </div>
    <div class="status" id="status">Indítsd a mikrofont, és fújd meg a hangot. Jó hang = új blokk. Fogás nélkül 2 blokk jár!</div>
    <div class="heard" id="heard"></div>
  </section>

  <div class="actions">
    <button class="primary" id="startBtn">Mikrofon indítása</button>
    <button id="listenBtn">Meghallgatom</button>
    <button id="skipBtn">Másik hang</button>
  </div>
  <div class="err" id="err" role="alert"></div>

  <details>
    <summary>Beállítások</summary>
    <div class="row" id="rangeRow"><label for="range">Hangterjedelem<small>Csak szabad gyakorlásnál.</small></label>
      <select id="range">
        <option value="46-65">Kezdő: nagy B – f¹</option>
        <option value="43-67">Közép: nagy G – g¹</option>
        <option value="40-70">Haladó: nagy E – b¹</option>
      </select></div>
    <div class="row"><label for="show">Mit mutasson?</label>
      <select id="show">
        <option value="both">Kotta és hangnév</option>
        <option value="staff">Csak kotta</option>
        <option value="name">Csak hangnév</option>
      </select></div>
    <div class="row"><label for="octave">Az oktáv is számítson<small>Kikapcsolva bármelyik oktávban elfogadja a hangot.</small></label>
      <input type="checkbox" id="octave" checked></div>
    <div class="row"><label for="tol">Tűrés: ±<span id="tolVal">10</span> cent<small>Kisebb érték = pontosabb intonáció kell. Hangolás: a¹ = 442 Hz.</small></label>
      <input type="range" id="tol" min="5" max="15" step="1" value="10"></div>
    <div class="row"><label for="showPos">Fogás mutatása<small>Kikapcsolva nincs segítség, a jó hangért mindig 2 blokk jár.</small></label>
      <input type="checkbox" id="showPos" checked></div>
    <div class="row rrow"><label for="tempo">Tempó: <span id="tempoVal">60</span> negyed/perc<small>Ritmusos módban.</small></label>
      <input type="range" id="tempo" min="40" max="120" step="4" value="60"></div>
    <div class="row rrow"><label for="rtol">Ritmus tűrés: ±<span id="rtolVal">150</span> ms<small>Ennyit csúszhat egy hang a helyéhez képest.</small></label>
      <input type="range" id="rtol" min="60" max="250" step="10" value="150"></div>
    <div class="row rrow"><label for="lat">Késés kiegyenlítése: <span id="latVal">120</span> ms<small>Ha az app mindig „későn”-t jelez, növeld.</small></label>
      <input type="range" id="lat" min="0" max="400" step="10" value="120"></div>
    <div class="row rrow"><label for="demo">Előbb lejátssza az ütemet<small>Meghallod, hogyan kell szólnia.</small></label>
      <input type="checkbox" id="demo" checked></div>
    <div class="row rrow"><label for="click">Metronóm játék közben<small>Halk kattanás minden negyedre.</small></label>
      <input type="checkbox" id="click" checked></div>
    <div class="row"><label for="sfx">Hanghatások<small>Építés hangjai.</small></label>
      <input type="checkbox" id="sfx" checked></div>
    <div class="row"><label>Másik építmény<small>Most rögtön válassz másikat.</small></label>
      <button class="reset" id="pickBtn" style="border-color:var(--brass);color:var(--ink)">Választás</button></div>
    <div class="row"><label>Építés újrakezdése<small>Törli a megépített épületeket és a pontokat.</small></label>
      <button class="reset" id="resetBtn">Újrakezdés</button></div>
  </details>
</main>

<div class="setup" id="setup" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
  <div class="box">
    <h2 id="setupTitle">Mit gyakorolunk?</h2>
    <h3>Kotta</h3>
    <div class="opts" id="pieceOpts"></div>
    <h3>Sorrend</h3>
    <div class="opts">
      <button class="opt" data-order="seq">Sorban<small>Ahogy a kottában következnek, ütemről ütemre.</small></button>
      <button class="opt" data-order="rand">Véletlenszerűen<small>Összevissza a darab hangjaiból.</small></button>
      <button class="opt" data-order="rhythm">Ütemenként, ritmussal<small>Meghallgatod az ütemet, jön a beszámolás, aztán te játszod. A hangot és az időzítést is figyeli.</small></button>
    </div>
    <div class="go" id="goBtns"></div>
  </div>
</div>

<script>

  const $=id=>document.getElementById(id);

  // ================= Hangadatok =================
  const HU=['C','Desz','D','Esz','E','F','Gesz','G','Asz','A','B','H'];
  const LETTER=[0,1,1,2,2,3,4,4,5,5,6,6];

  const POS={40:'7',41:'6',42:'5',43:'4',44:'3',45:'2',46:'1',47:'7',48:'6',49:'5',50:'4',51:'3',
    52:'2 (vagy 7)',53:'1 (vagy 6)',54:'5',55:'4',56:'3',57:'2 (vagy 6)',58:'1 (vagy 5)',59:'4 (vagy 7)',

  function huName(m){
    const pc=((m%12)+12)%12, oct=Math.floor(m/12)-1, n=HU[pc];
    if(oct<=2) return {big:n,oct:'nagy oktáv',full:'nagy '+n};
    if(oct===3) return {big:n.toLowerCase(),oct:'kis oktáv',full:'kis '+n.toLowerCase()};
    if(oct===4) return {big:n.toLowerCase()+'¹',oct:'egyvonalas oktáv',full:n.toLowerCase()+'¹'};
    return {big:n.toLowerCase()+'²',oct:'kétvonalas oktáv',full:n.toLowerCase()+'²'};
  }

  // ================= Darabok =================

  },{

  },{
    id:'diabelli44', title:'44. Allegro marciale', composer:'A. Diabelli',
    keyName:'F-dúr, 1 ♭', keyLetters:[6], keySteps:[2], beats:4,
    src:[
      {lb:'1',n:[50,53,57,55,53],d:[1,1,1,.5,.5]},
      {lb:'2',n:[52,55,57,55,52],d:[1,1,1,.5,.5]},

      streak++; $('stage').className='stage ok'; sfx('bonus');
      placeBlock(); if(prog.placed<cells.length) setTimeout(()=>{placeBlock();updateBuildUI();save();},220);
      let done=false; mode.bar++; if(mode.bar>=p.bars.length){ mode.bar=0; done=true; } saveMode();
      setStatus(done?'Hibátlan! Végigjátszottad az egész darabot!':'Hibátlan ütem! +2 blokk','ok');
      if(done) setTimeout(()=>{sfx('done');confetti();},400);
      score(); updateBuildUI(); save();
      setTimeout(()=>{ if(R.phase!=='idle') return; R.lastRes=null;
        if(prog.placed>=cells.length) finishBuild(); else newTarget(done?'Kezdjük elölről! Nyomd meg az „Ütem indítása” gombot.':undefined); }, done?2600:2000);
    }else{
      streak=0;
      if(good>=Math.ceil(n*.75)){ $('stage').className='stage ok'; sfx('place'); placeBlock(); setStatus('Majdnem! +1 blokk. Próbáld újra, vagy lépj a következő ütemre.','ok'); }
      else { $('stage').className='stage bad'; sfx('miss'); setStatus('Ez most nem sikerült. Nézd meg a jeleket, és próbáld újra!','bad'); }
      $('rGo').textContent='Újra';
      score(); updateBuildUI(); save();
      setTimeout(()=>{ if(prog.placed>=cells.length) finishBuild(); },900);
    }
  }

  // ================= Figyelő ciklus =================
  function loop(now){
    if(!running) return;
    requestAnimationFrame(loop);
    if(isRhythm()){ if(R.phase==='run') rhythmFrame(); return; }
    if(now-lastRun<45) return; lastRun=now;
    const t=performance.now();
    if(t<muteUntil||locked){showNeedle(null);return;}
    analyser.getFloatTimeDomainData(buf);
    const f=yin(buf,actx.sampleRate);
    if(f<60||f>800){history=[];holdStart=0;wrongStart=0;showNeedle(null);$('heard').textContent='';
      if(needGap){needGap=false;setStatus('Most fújd meg!','');}
      return;}
    if(needGap){showNeedle(null);return;}
    const mf=69+12*Math.log2(f/A4);
    history.push(mf); if(history.length>5) history.shift();
    const med=[...history].sort((a,b)=>a-b)[history.length>>1];
    const s=settings();
    const tgt=s.octave?target:target+12*Math.round((med-target)/12);
    const diff=(med-tgt)*100, nearest=Math.round(med);
    $('heard').textContent='Hallott hang: '+huName(nearest).full;
    showNeedle(Math.max(-50,Math.min(50,diff)));
    if(Math.abs(diff)<=s.tol){
      wrongStart=0; if(!holdStart) holdStart=t;
      setStatus('Tartsd még…','ok');
      if(t-holdStart>350) success();
    }else{
      holdStart=0;
      if(Math.abs(diff)<100){ setStatus(diff>0?'Kicsit magas – told ki picit a húzót':'Kicsit mély – húzd be picit a húzót','bad'); wrongStart=0; }
      else{
        setStatus(diff>0?'Ez magasabb a kértnél':'Ez mélyebb a kértnél','bad');
        if(wrongNote!==nearest){wrongNote=nearest;wrongStart=t;}
        else if(t-wrongStart>700&&!missedThis) miss();
      }
    }
  }
  function showNeedle(c){const n=$('needle'); if(c==null){n.style.opacity=0;return;} n.style.opacity=1; n.style.left=(50+c)+'%';}

  // ================= Mikrofon =================
  let stream=null;
  async function start(){
    $('err').textContent='';
    if(running){stop();return;}
    try{
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error('nosupport');
      stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      const c=getCtx(); await c.resume();
      const src=c.createMediaStreamSource(stream);
      analyser=c.createAnalyser(); analyser.fftSize=2048; src.connect(analyser);
      buf=new Float32Array(analyser.fftSize);
      running=true; $('startBtn').textContent='Mikrofon leállítása';
      if(!isRhythm()) setStatus('Fújd meg ezt a hangot!','');
      requestAnimationFrame(loop);
    }catch(e){
      $('err').textContent=(e.message==='nosupport'
        ?'Ez a böngésző nem enged mikrofont. Próbáld Chrome-ban vagy Safariban.'
        :(window.self!==window.top
          ?'A mikrofon ebben a beágyazott nézetben nincs engedélyezve. Nyisd meg az oldalt külön böngészőablakban.'
          :'Nem kaptam hozzáférést a mikrofonhoz. Engedélyezd a böngésző címsorában vagy a telefon beállításaiban, majd próbáld újra.'))
        +' ['+(e.name||'?')+', '+location.protocol+', biztonságos: '+(window.isSecureContext?'igen':'nem')+']';
    }
  }
  function stop(){
    if(R.phase==='run') rStop();
    running=false; if(stream) stream.getTracks().forEach(t=>t.stop());
    $('startBtn').textContent='Mikrofon indítása'; showNeedle(null);
    setStatus('Szünet. Indítsd újra, ha folytatnád.','');
  }
  function listen(){
    try{
      const c=getCtx(); c.resume(); const now=c.currentTime, dur=1.4;
      const o=c.createOscillator(),g=c.createGain(),lp=c.createBiquadFilter();
      o.type='sawtooth'; o.frequency.value=A4*Math.pow(2,(target-69)/12);
      lp.type='lowpass'; lp.frequency.value=1800;
      g.gain.setValueAtTime(0,now); g.gain.linearRampToValueAtTime(.18,now+.06);
      g.gain.setValueAtTime(.18,now+dur-.25); g.gain.linearRampToValueAtTime(0,now+dur);
      o.connect(lp); lp.connect(g); g.connect(c.destination); o.start(now); o.stop(now+dur+.05);
      muteUntil=performance.now()+dur*1000+350; history=[];
    }catch(e){}
  }

  $('startBtn').addEventListener('click',start);
  $('listenBtn').addEventListener('click',()=>{
    if(!isRhythm()) return listen();
    if(R.phase==='run') return;
    const c=getCtx(); c.resume(); const p=curPiece();
    schedNotes(barData(p,mode.bar),c.currentTime+.1,60/rset().tempo,[]);
  });
  $('skipBtn').addEventListener('click',()=>{
    if(isRhythm()){ if(R.phase==='run') rStop(); const p=curPiece(); mode.bar=(mode.bar+1)%p.bars.length; saveMode(); R.lastRes=null; newTarget(); return; }
    if(locked) return; streak=0; score(); prevHit=null;
    const p=curPiece(); if(p&&mode.order==='seq'){ mode.pos=(mode.pos+1)%p.notes.length; saveMode(); }
    newTarget();
  });

  // ================= Választó ablak =================
  let draft={};
  function openSetup(){
    draft={piece:mode.piece,order:mode.order};
    const box=$('pieceOpts'); box.innerHTML='';
    const items=[{id:'',t:'Szabad gyakorlás',d:'Véletlen hangok a beállított hangterjedelemből.'}]
      .concat(PIECES.map(p=>({id:p.id,t:p.title+' – '+p.composer,d:p.keyName+', '+p.notes.length+' hang, '+p.bars.length+' ütem'})));
    items.forEach(it=>{
      const b=document.createElement('button'); b.className='opt'; b.dataset.piece=it.id;
      b.innerHTML=it.t+'<small>'+it.d+'</small>';
      b.addEventListener('click',()=>{draft.piece=it.id||null;paintSetup();});
      box.appendChild(b);
    });
    paintSetup(); $('setup').classList.add('show');
  }
  function paintSetup(){
    document.querySelectorAll('#pieceOpts .opt').forEach(b=>b.setAttribute('aria-pressed',String((b.dataset.piece||null)===draft.piece)));
    document.querySelectorAll('[data-order]').forEach(b=>{b.disabled=!draft.piece;b.setAttribute('aria-pressed',String(!!draft.piece&&b.dataset.order===draft.order));});
    const go=$('goBtns'); go.innerHTML='';
    const add=(txt,cls,fn)=>{const b=document.createElement('button');b.textContent=txt;if(cls)b.className=cls;b.addEventListener('click',fn);go.appendChild(b);};
    const p=PIECES.find(x=>x.id===draft.piece);
    const same=p&&mode.piece===draft.piece;
    const canResume=same&&((draft.order==='seq'&&mode.pos>0)||(draft.order==='rhythm'&&mode.bar>0));
    if(canResume){
      const lab=draft.order==='rhythm'?p.labels[mode.bar]:p.notes[mode.pos].lab;
      add('Folytatom: '+lab,'primary',()=>applySetup(false));
      add('Elölről kezdem','',()=>applySetup(true));
    }else add('Kezdés','primary',()=>applySetup(true));
  }
  document.querySelectorAll('[data-order]').forEach(b=>b.addEventListener('click',()=>{draft.order=b.dataset.order;paintSetup();}));
  function applySetup(fromStart){
    if(R.phase==='run') rStop();
    if(fromStart){ if(draft.order==='rhythm') mode.bar=0; else mode.pos=0; }
    mode.piece=draft.piece; mode.order=draft.order; R.lastRes=null;
    saveMode(); prevHit=null; streak=0; score();
    $('setup').classList.remove('show');
    if(!$('overlay').classList.contains('show')) newTarget(); else renderNote();
  }
  $('modechip').addEventListener('click',openSetup);
  ['range','show','octave','showPos','sfx','demo','click'].forEach(id=>$(id).addEventListener('change',()=>{ saveSettings(); if(id==='range') newTarget(); else renderNote(); }));
  ['tol','tempo','rtol','lat'].forEach(id=>$(id).addEventListener('input',()=>{ saveSettings(); syncLabels(); if(id==='tol') renderNote(); }));
  function bumpTempo(d){ if(R.phase==='run') return; const e=$('tempo'); e.value=Math.max(40,Math.min(120,+e.value+d)); saveSettings(); syncLabels(); }
  $('tDn').addEventListener('click',()=>bumpTempo(-4));
  $('tUp').addEventListener('click',()=>bumpTempo(4));
  $('rGo').addEventListener('click',rStart);
  $('rCal').addEventListener('click',()=>{ const e=$('lat'); e.value=Math.max(0,Math.min(400,+e.value+R.calMs)); saveSettings(); syncLabels(); $('rCal').hidden=true; $('rInfo').textContent='Késés kiegyenlítése: '+e.value+' ms. Próbáld újra az ütemet!'; });
  $('resetBtn').addEventListener('click',()=>{
    if(!confirm('Biztosan újrakezded? A megépített épületek és a pontok törlődnek.')) return;
    prog={bp:0,placed:0,hits:0,done:{}}; streak=0; save();
    cells=cellsOf(BPS[0]); $('overlay').classList.remove('show'); locked=false;
    score(); updateBuildUI(); draw(); newTarget();
  });
  window.addEventListener('resize',resize);
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',draw);

  score(); updateBuildUI(); resize(); newTarget();
  if(prog.placed>=cells.length) finishBuild();
  openSetup();
})();
</script>
</body>
